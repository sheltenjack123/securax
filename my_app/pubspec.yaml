name: securax
description: A mobile security application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & storage
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # UI & Utils
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # App Features
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  camera: ^0.11.0
  screen_brightness: ^0.2.2
  flutter_volume_controller: ^1.3.4

  # Evidence actions (save/share from Evidence Vault)
  share_plus: ^10.0.0
  
  # Firebase (Kept for Auth)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon2.png
    - assets/icon/lock_only.png
    - assets/icon/background_matrix.png
    - assets/icon/text_logo.png
